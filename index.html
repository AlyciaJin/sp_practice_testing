<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디 살아요? 말하기 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one working column. The lesson steps stay on top and the current activity fills the sheet below. */
:root {
  --bg: #eaeef5; --sheet: #ffffff; --ink: #1b2436; --muted: #566076; --line: #c9d1df; --soft: #f2f4f9;
  --accent: #2343c4; --on-accent: #ffffff; --good: #116a3b; --bad: #b3261e; --rec: #c2261c;
  --noun-bg: #d9ebf7; --noun-fg: #0b4569; --noun-bd: #2a7fb0;
  --part-bg: #f8dfed; --part-fg: #771449; --part-bd: #b8377f;
  --end-bg: #fbeac4; --end-fg: #643d00; --end-bd: #bd8614;
  --font-display: "Gaegu", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121723; --sheet: #1b2230; --ink: #e8ecf4; --muted: #a3adc0; --line: #3a4557; --soft: #242c3b;
  --accent: #8fa6ff; --on-accent: #101626; --good: #6fd39c; --bad: #ff9c94; --rec: #ff8177;
  --noun-bg: #143449; --noun-fg: #bfe2f8; --noun-bd: #4ba0d3;
  --part-bg: #451a33; --part-fg: #f7cbe3; --part-bd: #d9659f;
  --end-bg: #41300d; --end-fg: #f8e0a8; --end-bd: #d8a53a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121723; --sheet: #1b2230; --ink: #e8ecf4; --muted: #a3adc0; --line: #3a4557; --soft: #242c3b;
  --accent: #8fa6ff; --on-accent: #101626; --good: #6fd39c; --bad: #ff9c94; --rec: #ff8177;
  --noun-bg: #143449; --noun-fg: #bfe2f8; --noun-bd: #4ba0d3;
  --part-bg: #451a33; --part-fg: #f7cbe3; --part-bd: #d9659f;
  --end-bg: #41300d; --end-fg: #f8e0a8; --end-bd: #d8a53a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font: 700 2.1rem/1.15 var(--font-display); margin: 0; }
.sub { color: var(--muted); font-size: .9rem; }
.status { font-size: .84rem; color: var(--muted); display: grid; gap: 6px; }
.status summary { cursor: pointer; }
.status .warn { color: var(--bad); }
.status select { font: inherit; max-width: 100%; padding: 4px; color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; }
.voice-row { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-top: 6px; }
.voice-row label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
nav button {
  font: inherit; font-size: .8rem; line-height: 1.3; text-align: left; color: var(--muted); cursor: pointer;
  background: transparent; border: 0; border-top: 3px solid var(--line); padding: 7px 4px 4px; min-width: 0;
}
nav button b { display: block; font-size: .92rem; }
nav button[aria-current="step"] { color: var(--ink); border-top-color: var(--accent); }
nav button.done { border-top-color: var(--good); }
nav button.done b::after { content: " ✓"; color: var(--good); }
nav button[aria-current="step"].done { border-top-color: var(--accent); }
main { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
@media (max-width: 480px) { main { padding: 16px 14px; } nav button span { display: none; } }
h2 { font-size: 1.2rem; line-height: 1.35; margin: 0; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn {
  font: 500 .95rem/1.2 var(--font-body); min-height: 44px; padding: 10px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink); display: inline-flex; align-items: center; gap: 8px;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.rec { background: var(--rec); border-color: var(--rec); color: var(--on-accent); }
.btn.rec.on { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .btn.rec.on { animation: none; } }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; }
.msg { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--soft); }
.msg.good { color: var(--good); font-weight: 500; }
.msg.bad { color: var(--bad); }

/* Drag tokens */
.tok {
  font: 500 1.02rem/1.3 var(--font-body); color: var(--ink); background: var(--soft); border: 1.5px solid var(--line);
  padding: 6px 11px; min-height: 38px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 4px;
}
.tok:disabled { cursor: default; }
.tok.selected { outline: 3px solid var(--accent); outline-offset: 1px; }
.tok.ghost { opacity: .3; }
.tok.floating { position: fixed; z-index: 50; pointer-events: none; margin: 0; cursor: grabbing; box-shadow: 0 6px 16px rgb(0 0 0 / .28); }
.tok.n { background: var(--noun-bg); color: var(--noun-fg); border-color: var(--noun-bd); border-radius: 3px; }
.tok.p { background: var(--part-bg); color: var(--part-fg); border-color: var(--part-bd); border-radius: 999px; }
.tok.e { background: var(--end-bg); color: var(--end-fg); border-color: var(--end-bd); border-radius: 3px 16px 16px 3px; }
.tok.en { width: 100%; text-align: left; font-weight: 400; }
.slot { border: 1.5px dashed var(--line); border-radius: 5px; background: var(--soft); cursor: pointer; }
.slot.over { border-color: var(--accent); border-style: solid; }
.slot.wrong { border: 2px solid var(--bad); }
.slot.filled { border-style: solid; border-color: transparent; background: transparent; }
.slot.wrong.filled { border-color: var(--bad); }
.bank { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; min-height: 64px; }
.bank.over { border-color: var(--accent); }
.bank-group { display: grid; grid-template-columns: 7.6rem minmax(0, 1fr); gap: 8px; align-items: start; }
@media (max-width: 480px) { .bank-group { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.bank-label { font-size: .8rem; color: var(--muted); padding-top: 8px; }
@media (max-width: 480px) { .bank-label { padding-top: 0; } }
.toks { display: flex; flex-wrap: wrap; gap: 7px; min-width: 0; }
.bank-empty { color: var(--muted); font-size: .88rem; }

/* Activity 1 */
.order { display: grid; gap: 8px; }
.order-row { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 8px; align-items: center; }
.order-row > b { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.order .slot { min-height: 44px; display: flex; }
.stack { display: grid; gap: 7px; }

/* Activity 2 */
.dlg { display: grid; gap: 10px; }
.dlg-line { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr); gap: 8px; align-items: baseline; }
.who { font-size: .85rem; color: var(--muted); font-weight: 500; }
.dlg-parts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 1.05rem; min-width: 0; }
.dlg-parts .slot { min-width: 3.4rem; min-height: 40px; display: inline-flex; }
.dlg-parts .slot .tok { width: 100%; }
.ko-big { font-size: 1.28rem; font-weight: 500; line-height: 1.5; }
.reveal { border-left: 4px solid var(--good); padding: 4px 0 4px 12px; display: grid; gap: 6px; }

/* Activity 3 */
.line-dots { display: flex; flex-wrap: wrap; gap: 5px; }
.line-dots button { font: inherit; font-size: .85rem; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.line-dots button.now { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.line-dots button.done { color: var(--good); border-color: var(--good); }
.speeds { display: flex; gap: 6px; flex-wrap: wrap; }
.speed { font-size: .86rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.speed.now { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.speed.done { border-color: var(--good); color: var(--good); }
.pron { color: var(--muted); font-size: 1.02rem; }
.en-big { font-size: 1.1rem; }

/* Activities 4 and 5 */
.turns { display: grid; gap: 8px; }
.turn { padding: 10px 12px; border-radius: 6px; background: var(--soft); display: grid; gap: 6px; min-width: 0; }
.turn.mine { border: 1.5px solid var(--accent); background: transparent; }
.turn.past { background: transparent; border: 1px solid var(--line); }
.turn-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.linkbtn { font: inherit; font-size: .88rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; display: inline-flex; gap: 5px; align-items: center; }
.heard { margin: 0; overflow-wrap: anywhere; }
.hint { margin: 0; color: var(--muted); font-style: italic; }

/* Test log */
.log { font-size: .86rem; color: var(--muted); }
.log summary { cursor: pointer; padding: 4px 0; }
.log-body { display: grid; gap: 8px; padding-top: 6px; }
.log-scroll { overflow-x: auto; }
.log table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .82rem; }
.log th, .log td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 lang="ko">어디 살아요?</h1>
    <span class="sub">Korean 101 · Dialogue practice · Teacher test version</span>
  </header>
  <details class="status" id="status"><summary id="status-line">Checking speech tools…</summary><div id="status-body"></div></details>
  <nav id="steps" aria-label="Activities"></nav>
  <main id="main" aria-live="polite"></main>
  <details class="log" id="log"><summary id="log-sum">Speech log (0)</summary><div class="log-body" id="log-body"></div></details>
</div>

<script>
/* ============================================================
   LESSON CONTENT. Edit this block to change the dialogue.
   parts: plain strings stay visible in Activity 2.
          [text, type] become draggable pieces.
          type: n = 명사, p = 조사, e = 어미 결합형
   pron:  shown in the first Repeat round.
   tts:   optional text for the voice when it differs from ko.
   ============================================================ */
const LESSON = {
  speakers: { A: "소피아", B: "마이클" },
  speedRounds: [0.9, 0.95, 1],   // Activity 3 order
  repeatShow: [["ko", "pron", "en"], ["en"], []],  // What each speed shows: ko = Korean, pron = pronunciation, en = meaning
  maxAttempts: 3,                // First try plus two more
  lines: [
    { who: "A", ko: "마이클 씨, 어디 살아요?", en: "Michael, where do you live?",
      pron: "[마이클 씨, 어디 사라요]",
      parts: ["마이클 씨,", ["어디","n"], ["살아요","e"], "?"] },
    { who: "B", ko: "저는 둘루스에 살아요.", en: "I live in Duluth.",
      pron: "[저는 둘루스에 사라요]",
      parts: [["저","n"], ["는","p"], ["둘루스","n"], ["에","p"], ["살아요","e"], "."] },
    { who: "A", ko: "집이 가까워요, 멀어요?", en: "Is your home close or far?",
      pron: "[지비 가까워요, 머러요]",
      parts: [["집","n"], ["이","p"], ["가까워요","e"], ",", ["멀어요","e"], "?"] },
    { who: "B", ko: "조금 멀어요.", en: "It's a little far.",
      pron: "[조금 머러요]",
      parts: ["조금", ["멀어요","e"], "."] },
    { who: "A", ko: "집에서 학교까지 얼마나 걸려요?", en: "How long does it take from your home to school?",
      pron: "[지베서 학꾜까지 얼마나 걸려요]",
      parts: [["집","n"], ["에서","p"], ["학교","n"], ["까지","p"], "얼마나", ["걸려요","e"], "?"] },
    { who: "B", ko: "집에서 학교까지 차로 30분쯤 걸려요.", en: "It takes about 30 minutes by car from my home to school.",
      pron: "[지베서 학꾜까지 차로 삼십뿐쯤 걸려요]", tts: "집에서 학교까지 차로 삼십 분쯤 걸려요.",
      parts: [["집","n"], ["에서","p"], ["학교","n"], ["까지","p"], ["차","n"], ["로","p"], "30분쯤", ["걸려요","e"], "."] },
  ],
};
const TYPE_LABEL = { n: "명사 Noun", p: "조사 Particle", e: "어미 결합형 Verb + ending" };

/* Helpers */
const $ = (id) => document.getElementById(id);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(n.dataset, v);
    else if (k === "disabled") n.disabled = !!v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
function icon(name) {
  const paths = {
    play: "M4 2l10 6-10 6z", stop: "M3 3h10v10H3z",
    mic: "M8 1a2.5 2.5 0 0 0-2.5 2.5v4a2.5 2.5 0 0 0 5 0v-4A2.5 2.5 0 0 0 8 1zM3.5 7a.75.75 0 0 1 1.5 0 3 3 0 0 0 6 0 .75.75 0 0 1 1.5 0 4.5 4.5 0 0 1-3.75 4.44V14h1.5v1h-4.5v-1h1.5v-2.56A4.5 4.5 0 0 1 3.5 7z",
  };
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("class", "i"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", paths[name]); s.append(p);
  return s;
}
const ko = (text, cls) => el("span", { lang: "ko", class: cls, text });
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const nameOf = (who) => LESSON.speakers[who];

/* ---------- Voice (text to speech) ---------- */
const TTS = {
  supported: "speechSynthesis" in window, voices: [], pick: { A: null, B: null }, current: null,
  load() {
    if (!this.supported) return;
    const all = speechSynthesis.getVoices();
    this.voices = all.filter((v) => /^ko/i.test(v.lang));
    if (!this.pick.A && this.voices[0]) this.pick.A = this.voices[0];
    if (!this.pick.B && this.voices[0]) this.pick.B = this.voices[1] || this.voices[0];
  },
  cancel() { if (this.supported) speechSynthesis.cancel(); },
  speak(line, rate = 1) {
    return new Promise((resolve) => {
      if (!this.supported) return resolve(false);
      speechSynthesis.cancel();
      const text = line.tts || line.ko;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR"; u.rate = rate;
      const v = this.pick[line.who];
      if (v) u.voice = v;
      // With only one Korean voice on the device, a lower pitch separates the two speakers.
      if (line.who === "B" && this.pick.A === this.pick.B) u.pitch = 0.8;
      let finished = false;
      const end = (ok) => { if (!finished) { finished = true; clearTimeout(guard); resolve(ok); } };
      const guard = setTimeout(() => end(false), Math.max(6000, text.length * 500 / rate));
      u.onend = () => end(true); u.onerror = () => end(false);
      this.current = u; // Holds a reference so the browser does not drop the end event.
      setTimeout(() => speechSynthesis.speak(u), 60);
    });
  },
};

/* ---------- Speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STT = {
  supported: !!SR, mode: "online", localState: "unknown", rec: null, active: false,
  async checkLocal() {
    if (!SR || typeof SR.available !== "function") return;
    try {
      this.localState = await SR.available({ langs: ["ko-KR"], processLocally: true });
      if (this.localState === "available") this.mode = "device";
    } catch (e) { this.localState = "unavailable"; }
  },
  async install() {
    try {
      const ok = await SR.install({ langs: ["ko-KR"], processLocally: true });
      if (ok) { this.localState = "available"; this.mode = "device"; }
      return ok;
    } catch (e) { return false; }
  },
  listen() {
    return new Promise((resolve) => {
      const rec = new SR();
      rec.lang = "ko-KR"; rec.interimResults = true; rec.maxAlternatives = 1;
      rec.continuous = !/Android/i.test(navigator.userAgent);
      if (this.mode === "device") rec.processLocally = true;
      let text = "", error = null, finished = false;
      const finish = () => { if (finished) return; finished = true; clearTimeout(limit); clearTimeout(this.after); this.active = false; this.rec = null; resolve({ text: text.trim(), error }); };
      const limit = setTimeout(() => this.stop(), 15000);
      rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript + " "; text = t; };
      rec.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") error = e.error; };
      rec.onend = finish;
      this.rec = rec; this.finish = finish; this.active = true;
      try { rec.start(); } catch (e) { error = "start-failed"; finish(); }
    });
  },
  stop() {
    if (!this.rec) return;
    try { this.rec.stop(); } catch (e) {}
    clearTimeout(this.after);
    this.after = setTimeout(() => this.finish && this.finish(), 4000); // Some browsers never fire the end event.
  },
  abort() { if (this.rec) { try { this.rec.abort(); } catch (e) {} } },
};
function errorMessage(code) {
  if (code === "not-allowed" || code === "service-not-allowed") return "The microphone is blocked. Allow it for this page in the browser's address bar, then try again.";
  if (code === "audio-capture") return "No microphone was found. Connect one, then try again.";
  if (code === "network") return "Speech recognition needs an internet connection. Check the connection, then try again.";
  if (code === "language-not-supported") return "Korean recognition is not available on this device. Switched to the online service. Try again.";
  return "Speech recognition stopped. Try again.";
}
function handleSttError(code) { if (code === "language-not-supported" && STT.mode === "device") { STT.mode = "online"; renderStatus(); } }
function normalize(s) {
  return s.toLowerCase().replace(/michael/g, "마이클").replace(/duluth/g, "둘루스").replace(/30/g, "삼십")
    .replace(/[\s.,?!·'"…~]/g, "");
}
const matches = (heard, line) => normalize(heard) === normalize(line.ko);

/* ---------- App state ---------- */
const STEPS = [
  { key: "a1", short: "Order", label: "Put meanings in order" },
  { key: "a2", short: "Build", label: "Build the dialogue" },
  { key: "a3", short: "Repeat", label: "Repeat at three speeds" },
  { key: "a4", short: "Speak A", label: "Speak as 소피아" },
  { key: "a5", short: "Speak B", label: "Speak as 마이클" },
];
const S = { step: 0, done: {}, log: [], run: 0, a1: null, a2: null, a3: null, a4: null, a5: null };
function stopAll() { S.run++; TTS.cancel(); STT.abort(); }

/* One place for saved activity. A later login and database version only needs to send these entries to the server. */
function record(entry) {
  S.log.push({ time: new Date().toLocaleTimeString(), ...entry });
  renderLog();
}
function complete(key) { S.done[key] = true; renderSteps(); }

/* ---------- Drag board shared by Activities 1 and 2 ---------- */
function newBoard(tokens, slots) {
  const place = {}; slots.forEach((s) => (place[s.id] = null));
  return { tokens, slots, place, attempts: 0, wrong: new Set(), state: "working", selected: null, note: null };
}
const slotOf = (b, tid) => Object.keys(b.place).find((s) => b.place[s] === tid) || null;
const tokenById = (b, id) => b.tokens.find((t) => t.id === id);
function moveToken(b, tid, target) {
  const from = slotOf(b, tid);
  if (from === target) return;
  if (target) {
    const other = b.place[target];

  const body = $("log-body"); body.textContent = "";
  const rows = S.log.filter((e) => e.target);
  if (!rows.length) { body.append(el("span", { text: "What the recognizer returns appears here, so you can compare it with what you actually said. It stays in this tab and clears when the page reloads." })); return; }
  const cols = ["time", "activity", "line", "speed", "target", "heard", "result"];
  body.append(el("div", { class: "log-scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, cols.map((c) => el("th", { text: c })))),
    el("tbody", {}, rows.map((r) => el("tr", {}, cols.map((c) => el("td", { class: c === "time" || c === "line" ? "n" : "", lang: c === "target" || c === "heard" ? "ko" : null, text: r[c] ?? "" }))))))));
  const copyMsg = el("span", {});
  body.append(el("div", { class: "row" }, el("button", { type: "button", class: "btn", text: "Copy for a spreadsheet", onclick: () => {
    const tsv = [cols.join("\t"), ...rows.map((r) => cols.map((c) => r[c] ?? "").join("\t"))].join("\n");
    navigator.clipboard.writeText(tsv).then(() => (copyMsg.textContent = "Copied"), () => (copyMsg.textContent = "Copy was blocked by the browser"));
  } }), copyMsg));
}
function renderStatus() {
  const noVoice = !TTS.supported || !TTS.voices.length;
  const parts = [];
  parts.push(noVoice ? "No Korean voice on this device" : `Korean voice ready (${TTS.voices.length})`);
  parts.push(!STT.supported ? "Speech recognition not available" : STT.mode === "device" ? "Recognition runs on this device" : "Recognition uses an online service");
  $("status-line").textContent = parts.join(" · ");
  const body = $("status-body"); body.textContent = "";
  if (noVoice) body.append(el("p", { class: "warn", text: "Install a Korean voice in the system settings or open this page in Chrome, Edge or Safari. The dialogue will not play without one." }));
  if (!STT.supported) body.append(el("p", { class: "warn", text: "This browser has no speech recognition. Use desktop Chrome for this test. An 'I said it' button replaces Record here." }));
  else if (STT.mode === "online") {
    body.append(el("p", { class: "warn", text: "Speech goes to the browser's online service (Google, in Chrome). Use this version with teacher voices only." }));
    if (STT.localState === "unknown" && typeof SR.available === "function") {
      // Runs only on request: this browser call has crashed a page in a build without the on-device service.
      body.append(el("div", { class: "row" }, el("button", { type: "button", class: "btn", text: "Check for on-device Korean recognition", onclick: async () => { await STT.checkLocal(); renderStatus(); } })));
    } else if (STT.localState === "unavailable") {
      body.append(el("p", { text: "On-device Korean recognition is not available in this browser." }));
    }
    if (STT.localState === "downloadable") {
      const msg = el("span", {});
      body.append(el("div", { class: "row" }, el("button", { type: "button", class: "btn", text: "Download Korean recognition to this device", onclick: async () => { msg.textContent = "Downloading…"; const ok = await STT.install(); msg.textContent = ok ? "" : "The download did not finish. The online service stays on."; renderStatus(); } }), msg));
    }
  } else body.append(el("p", { text: "Speech stays on this device." }));
  if (TTS.voices.length) {
    const select = (who) => el("label", {}, el("span", { lang: "ko", text: nameOf(who) }),
      (() => {
        const s = el("select", { id: "voice-" + who, onchange: (e) => { TTS.pick[who] = TTS.voices[+e.target.value]; } });
        TTS.voices.forEach((v, i) => { const o = el("option", { value: i, text: v.name }); if (TTS.pick[who] === v) o.selected = true; s.append(o); });
        return s;
      })());
    body.append(el("div", { class: "voice-row" }, select("A"), select("B")));
  }
}

/* ---------- Start ---------- */
TTS.load();
if (TTS.supported) speechSynthesis.addEventListener("voiceschanged", () => { TTS.load(); renderStatus(); });
renderSteps(); render(); renderLog(); renderStatus();
window.addEventListener("pagehide", stopAll);
</script>
</body>
