<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Performance Pre-Task</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one working column. The lesson steps stay on top and the current activity fills the sheet below. */
:root {
  --bg: #F7F5F0; --sheet: #ffffff; --ink: #1b2436; --title: #000000; --brand: #0A7762; --muted: #566076; --line: #d6d2c8; --soft: #f3f1ec;
  --accent: #2343c4; --on-accent: #ffffff; --good: #116a3b; --bad: #b3261e; --rec: #c2261c;
  --noun-bg: #d9ebf7; --noun-fg: #0b4569; --noun-bd: #2a7fb0;
  --part-bg: #f8dfed; --part-fg: #771449; --part-bd: #b8377f;
  --end-bg: #fbeac4; --end-fg: #643d00; --end-bd: #bd8614;
  --etc-bg: #e2efda; --etc-fg: #2c4a1c; --etc-bd: #5f9447;
  --jenny: #9966FF; --michael: #33CC33; --emily: #FF9933; --james: #3399FF; --avatar-ink: #1b2436;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181d; --sheet: #1e2228; --ink: #e8ecf4; --title: #ffffff; --brand: #5cc7a9; --muted: #a3adc0; --line: #3a414c; --soft: #272c34;
  --accent: #8fa6ff; --on-accent: #101626; --good: #6fd39c; --bad: #ff9c94; --rec: #ff8177;
  --noun-bg: #143449; --noun-fg: #bfe2f8; --noun-bd: #4ba0d3;
  --part-bg: #451a33; --part-fg: #f7cbe3; --part-bd: #d9659f;
  --end-bg: #41300d; --end-fg: #f8e0a8; --end-bd: #d8a53a;
  --etc-bg: #22371a; --etc-fg: #cfe8c2; --etc-bd: #7fb866;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #15181d; --sheet: #1e2228; --ink: #e8ecf4; --title: #ffffff; --brand: #5cc7a9; --muted: #a3adc0; --line: #3a414c; --soft: #272c34;
  --accent: #8fa6ff; --on-accent: #101626; --good: #6fd39c; --bad: #ff9c94; --rec: #ff8177;
  --noun-bg: #143449; --noun-fg: #bfe2f8; --noun-bd: #4ba0d3;
  --part-bg: #451a33; --part-fg: #f7cbe3; --part-bd: #d9659f;
  --end-bg: #41300d; --end-fg: #f8e0a8; --end-bd: #d8a53a;
  --etc-bg: #22371a; --etc-fg: #cfe8c2; --etc-bd: #7fb866;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 14px; }
header { display: grid; gap: 2px; }
.eyebrow { margin: 0; color: var(--brand); font-size: .92rem; font-weight: 500; }
h1 { font: 700 2rem/1.2 var(--font-body); color: var(--title); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; }
.status { font-size: .84rem; color: var(--muted); display: grid; gap: 6px; }
.status summary { cursor: pointer; }
.status .warn { color: var(--bad); }
.status select { font: inherit; max-width: 100%; padding: 4px; color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; }
.voice-row { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-top: 6px; }
.voice-row label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
nav { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 640px) { nav { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
nav button {
  font: inherit; font-size: .8rem; line-height: 1.25; text-align: center; color: var(--muted); cursor: pointer;
  background: transparent; border: 0; border-top: 3px solid var(--line); padding: 7px 4px 4px; min-width: 0;
}
nav button b { display: block; font-size: .92rem; }
nav button[aria-current="step"] { color: var(--ink); border-top-color: var(--accent); }
nav button.done { border-top-color: var(--good); }
nav button.done b::after { content: " ✓"; color: var(--good); }
nav button[aria-current="step"].done { border-top-color: var(--accent); }
main { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
@media (max-width: 480px) { main { padding: 16px 14px; } }
h2 { font-size: 1.2rem; line-height: 1.35; margin: 0; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0; }
.lead { margin: 4px 0 0; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn {
  font: 500 .95rem/1.2 var(--font-body); min-height: 44px; padding: 10px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink); display: inline-flex; align-items: center; gap: 8px;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.rec { background: var(--rec); border-color: var(--rec); color: var(--on-accent); }
.btn.rec.on { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .btn.rec.on { animation: none; } }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; }
.msg { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--soft); }
.msg.good { color: var(--good); font-weight: 500; }
.msg.bad { color: var(--bad); }

/* Drag tokens. Each type has its own shape, and an empty blank has the same shape as the piece it takes. */
.tok {
  font: 500 1.02rem/1.3 var(--font-body); color: var(--ink); background: var(--soft); border: 1.5px solid var(--line);
  padding: 6px 11px; min-height: 38px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 4px;
}
.tok:disabled { cursor: default; }
.tok.selected { outline: 3px solid var(--accent); outline-offset: 1px; }
.tok.ghost { opacity: .3; }
.tok.floating { position: fixed; z-index: 50; pointer-events: none; margin: 0; cursor: grabbing; box-shadow: 0 6px 16px rgb(0 0 0 / .28); }
.tok.n { background: var(--noun-bg); color: var(--noun-fg); border-color: var(--noun-bd); border-radius: 3px; }
.tok.p { background: var(--part-bg); color: var(--part-fg); border-color: var(--part-bd); border-radius: 999px; }
.tok.e { background: var(--end-bg); color: var(--end-fg); border-color: var(--end-bd); border-radius: 3px 16px 16px 3px; }
.tok.x { background: var(--etc-bg); color: var(--etc-fg); border-color: var(--etc-bd); border-radius: 12px 3px 12px 3px; }
.tok.en { width: 100%; text-align: left; font-weight: 400; }
.slot { border: 1.5px dashed var(--line); border-radius: 5px; background: var(--soft); cursor: pointer; }
.slot.n { border-color: var(--noun-bd); background: color-mix(in srgb, var(--noun-bg) 55%, transparent); border-radius: 3px; }
.slot.p { border-color: var(--part-bd); background: color-mix(in srgb, var(--part-bg) 55%, transparent); border-radius: 999px; }
.slot.e { border-color: var(--end-bd); background: color-mix(in srgb, var(--end-bg) 55%, transparent); border-radius: 3px 16px 16px 3px; }
.slot.x { border-color: var(--etc-bd); background: color-mix(in srgb, var(--etc-bg) 55%, transparent); border-radius: 12px 3px 12px 3px; }
.slot.over { border-color: var(--accent); border-style: solid; }
.slot.wrong { border: 2px solid var(--bad); }
.slot.filled { border-style: solid; border-color: transparent; background: transparent; }
.slot.wrong.filled { border-color: var(--bad); }
.bank { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; min-height: 64px; }
.bank.over { border-color: var(--accent); }
.bank-group { display: grid; grid-template-columns: 7.6rem minmax(0, 1fr); gap: 8px; align-items: start; }
@media (max-width: 480px) { .bank-group { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.bank-label { font-size: .8rem; color: var(--muted); padding-top: 8px; }
@media (max-width: 480px) { .bank-label { padding-top: 0; } }
.toks { display: flex; flex-wrap: wrap; gap: 7px; min-width: 0; }
.bank-empty { color: var(--muted); font-size: .88rem; }

/* Activity 1 */
.textbook { margin: 0; display: grid; gap: 6px; justify-items: start; }
.textbook img { max-width: 100%; max-height: 420px; border-radius: 6px; border: 1px solid var(--line); }
.textbook figcaption { font-size: .85rem; color: var(--muted); }
.order { display: grid; gap: 8px; }
.order-row { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 8px; align-items: center; }
.order-row > b { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.order .slot { min-height: 44px; display: flex; }
.stack { display: grid; gap: 7px; }

/* Activity 2 */
.dlg { display: grid; gap: 12px; }
.dlg-line { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: 8px; align-items: center; }
.who { font-size: .85rem; color: var(--muted); font-weight: 500; }
.dlg-parts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 1.05rem; min-width: 0; }
.dlg-parts .slot { min-width: 3.4rem; min-height: 40px; display: inline-flex; }
.dlg-parts .slot .tok { width: 100%; }
.ko-big { font-size: 1.28rem; font-weight: 500; line-height: 1.5; }
.reveal { border-left: 4px solid var(--good); padding: 4px 0 4px 12px; display: grid; gap: 6px; }

/* Activity 3 */
.line-dots { display: flex; flex-wrap: wrap; gap: 5px; }
.line-dots button { font: inherit; font-size: .85rem; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.line-dots button.now { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.line-dots button.done { color: var(--good); border-color: var(--good); }
.flow-steps { display: flex; gap: 6px; flex-wrap: wrap; }
.flow-steps span { font-size: .84rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
.flow-steps span.now { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.flow-steps span.done { border-color: var(--good); color: var(--good); }
.pron { color: var(--muted); font-size: 1.02rem; }
.en-big { font-size: 1.1rem; }
.en-cue { margin: 0; font-size: 1.05rem; }

/* Whole-dialogue follow-along */
.follow { display: grid; gap: 14px; }
.follow-row { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 480px) { .follow-row { grid-template-columns: 5.2rem minmax(0, 1fr); } .follow-row > .row { grid-column: 2; } }
.say-box {
  font: 500 1rem/1.4 var(--font-body); color: var(--ink); text-align: left; cursor: pointer; width: 100%; min-width: 0; min-height: 48px;
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--soft); border: 1.5px solid var(--line); border-radius: 4px; overflow-wrap: anywhere;
}
.say-box svg.i { color: var(--accent); }
.say-box:disabled { opacity: .45; cursor: not-allowed; }
.say-box.now { border-color: var(--accent); }
.say-box.playing { border-color: var(--accent); background: transparent; }
.follow-row .btn { min-height: 48px; }
.tries { grid-column: 2 / -1; display: grid; gap: 6px; }
@media (max-width: 480px) { .tries { grid-column: 1 / -1; } }
.try { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; }
.try .heard { flex: 1 1 200px; }

/* Speaking activities */
.turns { display: grid; gap: 8px; }
.turn { padding: 10px 12px; border-radius: 6px; background: var(--soft); display: grid; gap: 6px; min-width: 0; }
.turn.mine { border: 1.5px solid var(--accent); background: transparent; }
.turn.past { background: transparent; border: 1px solid var(--line); }
.turn-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.linkbtn { font: inherit; font-size: .88rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; display: inline-flex; gap: 5px; align-items: center; }
.heard { margin: 0; overflow-wrap: anywhere; }
.hint { margin: 0; color: var(--muted); font-style: italic; }
.round { font-size: .88rem; color: var(--muted); font-weight: 500; }

/* Scene: two people talking, with an optional background picture */
.scene {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 10px;
  padding: 16px 12px 12px; border-radius: 8px; background: var(--soft) center / cover no-repeat; min-height: 250px;
}
.scene-mid { align-self: center; display: grid; justify-items: center; gap: 8px; min-width: 0; }
@media (max-width: 560px) { .scene { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .scene-mid { grid-column: 1 / -1; grid-row: 2; } }
.actor { display: grid; justify-items: center; gap: 8px; min-width: 0; transition: opacity .2s, filter .2s; }
.actor.dim { opacity: .45; filter: saturate(.4); }
.actor .figure { height: clamp(140px, 28vw, 230px); width: auto; max-width: 100%; object-fit: contain; display: block; }
.actor .figure-ph { width: clamp(90px, 18vw, 130px); aspect-ratio: 1; border-radius: 50%; background: var(--c); color: var(--avatar-ink); display: grid; place-items: center; font: 700 2.3rem/1 var(--font-body); }
.scene.photos { align-items: center; }
.scene.photos .actor .photo { width: clamp(110px, 21vw, 170px); aspect-ratio: 11 / 15; }
.actor .photo { width: clamp(100px, 20vw, 150px); aspect-ratio: 1; object-fit: cover; border-radius: 14px; border: 4px solid var(--c); display: block; }
.actor .tag { background: rgb(255 255 255 / .94); color: #1b2436; border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; box-shadow: inset 0 0 0 2px var(--c); max-width: 100%; }
.actor .tag .mini { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
.bubble {
  visibility: hidden; position: relative; background: #fff; color: #1b2436; border: 2px solid var(--c); border-radius: 14px;
  padding: 5px 12px; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; margin-bottom: 6px;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 13px; height: 13px; background: #fff; border-right: 2px solid var(--c); border-bottom: 2px solid var(--c); transform: translateX(-50%) rotate(45deg); }
.actor.speaking .bubble { visibility: visible; animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .55; } }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .actor.speaking .bubble, .dots i { animation: none; } .dots i { opacity: 1; } }

/* Listening player (Activities 1 and 2) */
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.bar { display: flex; gap: 4px; flex: 1 1 220px; min-width: 0; }
.seg { flex: 1; height: 14px; padding: 0; border: 0; border-radius: 3px; background: var(--soft); outline-offset: 2px; cursor: pointer; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.seg .fill { display: block; height: 100%; width: 0; background: var(--accent); }
.seg.now { box-shadow: inset 0 0 0 1.5px var(--accent); }
.seg.now.tts .fill { width: 100% !important; opacity: .35; }
.tnum { font-variant-numeric: tabular-nums; }

/* Recording cue on Record buttons */
.speak-cue { font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.speak-cue.live { color: var(--rec); }
.speak-cue.live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); }

/* Cue cards */
.cue-card { border: 1.5px solid var(--ink); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; max-width: 420px; background: var(--sheet); }
.cue-card h3 { margin: 0 0 4px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cue-row { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 8px; align-items: baseline; }
.cue-row span:first-child { color: var(--muted); font-size: .88rem; }
.cue-row span:last-child { font-weight: 700; font-size: 1.08rem; overflow-wrap: anywhere; }
.deck { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.card-back, .card-mini { width: 76px; height: 106px; border-radius: 8px; flex: none; }
.card-back { border: 3px solid #fff; cursor: pointer; box-shadow: 0 3px 8px rgb(0 0 0 / .22); background: repeating-linear-gradient(45deg, #0A7762 0 7px, #12957c 7px 14px); }
.card-back:disabled { opacity: .55; cursor: default; }
.card-mini { background: #fff; color: #1b2436; border: 2px solid #c9c4b8; display: grid; align-content: center; justify-items: center; gap: 2px; padding: 4px; font-size: .74rem; text-align: center; line-height: 1.25; }
.card-mini.now { border: 3px solid #0A7762; }
.card-mini b { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: #566076; }
.cue-two { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.cue-two > * { flex: 1 1 260px; }
.choices { display: flex; flex-wrap: wrap; gap: 12px; }
.choice { font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 0; border: 0; background: none; border-radius: 10px; flex: 1 1 240px; max-width: 420px; }
.choice .cue-card { border-width: 2px; }
.choice:disabled { cursor: default; color: inherit; opacity: 1; }
.choice.right .cue-card { border: 3px solid var(--good); }
.choice.picked-wrong .cue-card { border: 3px solid var(--bad); }
.mycard { display: grid; gap: 10px; max-width: 420px; }
.mycard label { display: grid; gap: 3px; font-size: .9rem; color: var(--muted); }
.mycard input { font: inherit; color: var(--ink); padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); }

.split { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
.split-side { position: sticky; top: 12px; display: grid; gap: 10px; }
.split-main { display: grid; gap: 12px; min-width: 0; }
.split-side .cue-row { grid-template-columns: 6.8rem minmax(0, 1fr); }
.split-main .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.split-main .choice .cue-row { grid-template-columns: 6.8rem minmax(0, 1fr); }
@media (max-width: 700px) { .split { grid-template-columns: minmax(0, 1fr); } .split-side { position: static; } }

.who { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.who-face { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; }
.actor .face-big { width: clamp(110px, 20vw, 160px); aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 4px solid var(--c); display: block; background: var(--sheet); }

/* Feedback icons: your own pictures in the images folder, or the device's emoji */
.fb { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.fb-img { height: 40px; width: auto; }
.fb-emoji { font-size: 1.6rem; line-height: 1; }
.fb.big .fb-img { height: 72px; }
.fb.big .fb-emoji { font-size: 3rem; }

/* Session recording */
.recorder { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; }
.recorder h2 { font-size: 1.02rem; }
.rec-preview { width: 192px; max-width: 100%; aspect-ratio: 16 / 9; background: var(--soft); border-radius: 4px; object-fit: cover; }
.rec-grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.rec-grid > div:not(.avatar) { min-width: 0; flex: 1 1 260px; display: grid; gap: 6px; }
.recbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--sheet); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.recbar-in { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.rec-dot { font-weight: 700; color: var(--rec); font-variant-numeric: tabular-nums; }
.meter { width: 90px; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.meter i { display: block; height: 100%; width: 0; background: var(--good); }
.rec-warn { flex-basis: 100%; margin: 0; color: var(--bad); font-weight: 500; }
body.recbar-on { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

/* Submit */
.field { display: grid; gap: 4px; max-width: 360px; }
.field input { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); }
.checklist { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: .92rem; }
.checklist .ok { color: var(--good); }
.checklist .no { color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 8px; }
.box video { width: 100%; max-width: 420px; border-radius: 4px; background: #000; }

.stage { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; }
.avatar { display: grid; justify-items: center; gap: 5px; transition: opacity .2s; min-width: 64px; }
.avatar .face {
  width: 56px; height: 56px; border-radius: 50%; background: var(--c); color: var(--avatar-ink); overflow: hidden;
  display: grid; place-items: center; font: 700 1.3rem/1 var(--font-body);
  transform: scale(calc(1 + var(--lvl, 0) * .18)); transition: transform .08s linear;
}
.avatar .face img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.avatar.student .face { box-shadow: 0 0 0 3px var(--c); }
.avatar .nm { font-size: .82rem; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.avatar.dim { opacity: .38; }
.avatar.speaking .face { animation: talk 1s ease-out infinite; }
.avatar.speaking .nm { color: var(--ink); font-weight: 700; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; visibility: hidden; }
.bars i { width: 3px; height: 4px; border-radius: 1px; background: var(--c); }
.avatar.speaking .bars { visibility: visible; }
.avatar.speaking .bars i { animation: bar .7s ease-in-out infinite; }
.avatar.speaking .bars i:nth-child(2) { animation-delay: .15s; }
.avatar.speaking .bars i:nth-child(3) { animation-delay: .3s; }
@keyframes talk { 0% { box-shadow: 0 0 0 0 var(--c); } 100% { box-shadow: 0 0 0 14px rgba(0, 0, 0, 0); } }
@keyframes bar { 0%, 100% { height: 4px; } 50% { height: 12px; } }
@media (prefers-reduced-motion: reduce) {
  .avatar.speaking .face { animation: none; box-shadow: 0 0 0 4px var(--c); }
  .avatar.speaking .bars i { animation: none; height: 10px; }
}

/* Hint note */
.postit {
  background: #FFF3A1; color: #3a3000; max-width: 460px; padding: 14px 18px 16px; border-radius: 2px;
  transform: rotate(-1.2deg); box-shadow: 0 7px 16px rgba(0, 0, 0, .18);
  font: 400 1.32rem/1.35 "Patrick Hand", "Gaegu", "Comic Sans MS", cursive; display: grid; gap: 8px;
}
.postit .tag { font-size: .95rem; color: #7a6a00; letter-spacing: .04em; }

.postit .rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; align-items: baseline; }
.postit .rows .ko { font-size: 1.4rem; }
.postit .rows .en { font-size: 1.15rem; }
.postit .eg { grid-column: 1 / -1; font-size: 1.05rem; color: #6b5c00; margin: -2px 0 4px 14px; }
.postit .big { font-size: 1.5rem; }
.postit .pr { font-size: 1.2rem; color: #6b5c00; }
.verdict { margin: 0; font-weight: 500; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.expected { margin: 0; color: var(--muted); overflow-wrap: anywhere; }

.intro { display: grid; gap: 16px; }
.steps-guide { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }

  return [el("div", { class: "intro" },
    el("div", {}, el("h2", { text: "Before you begin" }),
      el("p", { class: "lead", text: "This is a pre-task for your speaking performance. Listen to the dialogue from your textbook and practice speaking by following the steps in order. You need to complete all the steps." })),
    el("ol", { class: "steps-guide" },
      el("li", {}, el("b", { text: "1–2" }), el("span", { text: "Listen: put the meanings in order, then build the dialogue." })),
      el("li", {}, el("b", { text: "3–4" }), el("span", { text: "Repeat each line, then follow the whole dialogue." })),
      el("li", {}, el("b", { text: "5–8" }), el("span", { text: "Speak as Jenny and as Michael, practice with cue cards, and talk about yourself. These steps are recorded as one video." })),
      el("li", {}, el("b", { text: "9" }), el("span", { text: "Download: save your speech log (PDF) and your video, then submit both on Canvas." }))),
    el("p", { class: "sub", style: "margin:0", text: "You need a microphone and a camera. Use Chrome on a computer, and headphones if you have them. Reloading the page starts everything again." }),
    el("div", { class: "field" },
      el("label", { for: "start-name", text: "1. Your name" }),
      el("input", { id: "start-name", type: "text", autocomplete: "name", value: S.name, oninput: (e) => { S.name = e.target.value; $("begin").disabled = !canBegin(); } })),
    el("div", { style: "display:grid;gap:8px;" },
      el("span", { text: "2. Your photo" }),
      el("p", { class: "sub", style: "margin:0", text: "Take a photo of your face. It is shown when you speak, and it goes on your speech log." }),
      cam,
      CAM.error && el("p", { class: "msg bad", text: CAM.error })),
    el("div", { class: "field" }, el("span", { id: "color-label", text: "3. Choose your color" }),
      el("div", { class: "swatches", role: "radiogroup", "aria-labelledby": "color-label" }, STUDENT_COLORS.map(([nm, hex]) =>
        el("button", { type: "button", class: "swatch", role: "radio", "aria-checked": S.color === hex ? "true" : "false", "aria-label": nm, title: nm, style: `--c:${hex}`, dataset: { fk: "sw" + nm },
          onclick: () => { S.color = hex; render(); } })))),
    el("div", { class: "row" }, begin, !canBegin() && el("span", { class: "sub", text: !S.name.trim() && !S.photo ? "Enter your name and take a photo to begin." : !S.name.trim() ? "Enter your name to begin." : "Take a photo to begin." })))];
}

/* ---------- Page shell ---------- */
function renderSteps() {
  const nav = $("steps"); nav.textContent = ""; nav.hidden = !S.started;
  STEPS.forEach((s, i) => nav.append(el("button", {
    type: "button", class: S.done[s.key] ? "done" : "", "aria-current": i === S.step ? "step" : null, onclick: () => go(i), title: s.label,
  }, el("b", { text: String(i + 1) }), s.nav)));
}
function go(i) {
  stopAll(); S.step = i;
  const key = STEPS[i].key, st = S[key];
  if (st) {
    st.listening = false; st.stopping = false;
    if (key === "follow") { st.playing = null; st.rows.forEach((r) => { r.listening = false; r.stopping = false; }); }
    else if (key === "a3") { st.playing = false; }
    else if (key === "jenny" || key === "michael") { if (!["idle", "done", "mine"].includes(st.phase)) S[key] = newSpeak(st.round); }
    else if (key === "cue") { const c = st.cur; if (c) { c.listening = false; c.stopping = false; if (["partner", "between"].includes(c.phase)) st.cur = newTurn(st.deck, c.k); } }
    else if (key === "talk") { if (["partner", "between"].includes(st.phase)) Object.assign(st, { phase: "ready", qi: 0, wrong: 0, history: [], note: null, error: null }); }
    else st.playing = false;
  }
  renderSteps(); render(); renderRec(); window.scrollTo({ top: 0 });
}
function render() {
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
  const view = !S.started ? viewStart() : { a1: viewA1, a2: viewA2, a3: viewA3, follow: viewFollow, jenny: () => viewSpeak("jenny"), michael: () => viewSpeak("michael"), cue: viewCue, talk: viewTalk, submit: viewSubmit }[STEPS[S.step].key]();
  const main = $("main"); main.textContent = "";
  main.append(...view.flat(Infinity).filter(Boolean));
  if (focused) { const n = main.querySelector(`[data-fk="${focused}"]`); if (n) n.focus({ preventScroll: true }); }
  paintSpeakers();
}
function renderLog() {
  const rows = S.log.filter((e) => e.target);
  $("log-sum").textContent = `Speech log (${rows.length})`;
  const body = $("log-body"); body.textContent = "";
  if (!rows.length) { body.append(el("span", { text: "What the recognizer returns appears here, so you can compare it with what you actually said. It stays in this tab and clears when the page reloads." })); return; }
  const cols = ["time", "activity", "round", "line", "try", "target", "heard", "result"];
  const val = (r, c) => (c === "activity" ? ACT_NAME[r.activity] + (r.card && typeof r.card === "string" ? ` (${r.card})` : "") : r[c] ?? "");
  body.append(el("div", { class: "log-scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, cols.map((c) => el("th", { text: c })))),
    el("tbody", {}, rows.map((r) => el("tr", {}, cols.map((c) => el("td", { class: ["time", "line", "try", "round"].includes(c) ? "n" : "", lang: c === "target" || c === "heard" ? "ko" : null, text: String(val(r, c)) }))))))));
  const copyMsg = el("span", {});
  body.append(el("div", { class: "row" }, el("button", { type: "button", class: "btn", text: "Copy for a spreadsheet", onclick: () => {
    const tsv = [cols.join("\t"), ...rows.map((r) => cols.map((c) => val(r, c)).join("\t"))].join("\n");
    navigator.clipboard.writeText(tsv).then(() => (copyMsg.textContent = "Copied"), () => (copyMsg.textContent = "Copy was blocked by the browser"));
  } }), copyMsg));
}
function renderStatus() {
  const noVoice = !TTS.supported || !TTS.voices.length;
  const parts = [];
  const found = Voice.found();
  parts.push(found === AUDIO_ITEMS.length ? "Audio files ready" : found ? `Audio files: ${found} of ${AUDIO_ITEMS.length}` : (noVoice ? "No Korean voice on this device" : "Browser voice (no audio files yet)"));
  parts.push(!STT.supported ? "Speech recognition not available" : STT.mode === "device" ? "Recognition runs on this device" : "Recognition uses an online service");
  $("status-line").textContent = parts.join(" · ");
  const body = $("status-body"); body.textContent = "";
  body.append(el("p", {}, `Audio files found: ${found} of ${AUDIO_ITEMS.length}. Expected in the "${LESSON.audioFolder}" folder: `,
    el("span", { class: "tnum", text: AUDIO_ITEMS.map((it) => Voice.has[it.file] ? it.file.replace(LESSON.audioFolder, "") + " ✓" : it.audio + " (.mp3 or .wav)").join(", ") })));
  const imgs = IMAGE_NAMES.filter((n) => IMG.src[n]).length;
  body.append(el("p", {}, `Pictures found: ${imgs} of ${IMAGE_NAMES.length}. Expected in the "${LESSON.imageFolder}" folder (.png, .webp or .jpg): `,
    el("span", { text: IMAGE_NAMES.map((n) => (IMG.src[n] ? IMG.src[n].replace(LESSON.imageFolder, "") + " ✓" : n)).join(", ") })));
  if (noVoice && found < AUDIO_ITEMS.length) body.append(el("p", { class: "warn", text: "Install a Korean voice in the system settings or open this page in Chrome, Edge or Safari. The dialogue will not play without one." }));
  if (!STT.supported) body.append(el("p", { class: "warn", text: "This browser has no speech recognition. Use desktop Chrome for this test. An 'I said it' button replaces Record here." }));
  else if (STT.mode === "online") {
    body.append(el("p", { class: "warn", text: "Speech goes to the browser's online service (Google, in Chrome). Use this version with teacher voices only." }));
    if (STT.localState === "unknown" && typeof SR.available === "function") {
      body.append(el("div", { class: "row" }, el("button", { type: "button", class: "btn", text: "Check for on-device Korean recognition", onclick: async () => { await STT.checkLocal(); renderStatus(); } })));
    } else if (STT.localState === "unavailable") {
      body.append(el("p", { text: "On-device Korean recognition is not available in this browser." }));
    }
    if (STT.localState === "downloadable") {
      const msg = el("span", {});
      body.append(el("div", { class: "row" }, el("button", { type: "button", class: "btn", text: "Download Korean recognition to this device", onclick: async () => { msg.textContent = "Downloading…"; const ok = await STT.install(); msg.textContent = ok ? "" : "The download did not finish. The online service stays on."; renderStatus(); } }), msg));
    }
  } else body.append(el("p", { text: "Speech stays on this device." }));
  if (TTS.voices.length) {
    const select = (who) => el("label", {}, el("span", { lang: "ko", text: nameOf(who) }),
      (() => {
        const s = el("select", { id: "voice-" + who, onchange: (e) => { TTS.pick[who] = TTS.voices[+e.target.value]; } });
        TTS.voices.forEach((v, i) => { const o = el("option", { value: i, text: v.name }); if (TTS.pick[who] === v) o.selected = true; s.append(o); });
        return s;
      })());
    body.append(el("div", { class: "voice-row" }, Object.keys(LESSON.speakers).map(select)));
  }
}

/* ---------- Start ---------- */
TTS.load();
if (TTS.supported) speechSynthesis.addEventListener("voiceschanged", () => { TTS.load(); renderStatus(); });
renderSteps(); render(); renderLog(); renderStatus(); renderRec();
Voice.check().then(() => { renderStatus(); renderRec(); });
IMG.check().then(() => { renderStatus(); if (S.started) render(); });
window.addEventListener("pagehide", () => { stopAll(); CAM.close(); });
window.addEventListener("beforeunload", (e) => { if (REC.state === "recording" || REC.state === "paused" || (REC.blob && !S.submit?.vidMsg)) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
